name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-offline:
    name: Backend offline regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # run_offline_acceptance.py patches out database connections and HTTP clients,
      # so these suites check deterministic rules without any external service.
      - name: Offline suites
        run: |
          set -e
          for suite in verify_integrity_semantics verify_direction_enforcement verify_stream_lifecycle \
                       verify_pr5_pipeline verify_eval_tool verify_label_updates; do
            echo "::group::$suite"
            python tools/acceptance/run_offline_acceptance.py "tools/acceptance/$suite.py"
            echo "::endgroup::"
          done

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ahooks 3.8 declares a React <=18 peer range while the app runs on React 19.
      - run: npm ci --legacy-peer-deps
      - run: npm run build
